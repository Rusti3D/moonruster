[package]
name = "moonruster"
version = "0.1.0"
edition = "2021"
description = "Moonraker (Klipper API server) ported to Rust"
license = "GPL-3.0-only"

[[bin]]
name = "moonruster"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "fs", "time", "process", "signal", "io-util", "macros", "sync"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
hyper-tungstenite = "0.17"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup", "column_decltype"] }
minijinja = { version = "2", features = ["loader", "json", "urlencode", "custom_syntax", "loop_controls"] }
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
blake2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
percent-encoding = "2"
log = { version = "0.4", features = ["std"] }
libc = "0.2"
multer = "3"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
url = "2"
glob = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
ipnet = "2"
httpdate = "1"
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
inotify = "0.11"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
roxmltree = "0.20"
ldap3 = { version = "0.11", default-features = false, features = ["tls-rustls"] }
fancy-regex = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "qoi"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
webpki-roots = "1"
mdns-sd = "0.21"
socket2 = { version = "0.6", features = ["all"] }

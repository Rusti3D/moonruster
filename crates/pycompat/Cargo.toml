[package]
name = "pycompat"
version = "0.1.0"
edition = "2021"
description = "Python's own behaviour where Moonraker's output depends on it: str/repr/float formatting, int()/float(), configparser, shlex, inspect.cleandoc, mimetypes"
license = "GPL-3.0-only"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }

[package]
name = "metadata"
version = "0.1.0"
edition = "2021"
description = "Moonraker's gcode metadata extractor (file_manager/metadata.py), run as moonruster --metadata"
license = "GPL-3.0-only"

[dependencies]
pycompat = { path = "../pycompat" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
fancy-regex = "0.14"
base64 = "0.22"
